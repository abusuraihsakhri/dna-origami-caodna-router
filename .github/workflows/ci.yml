name: Python CI and security verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      AUDIT_SECRET_KEY: ci-only-signing-key-not-for-production-0123456789

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents dna_origami_router cli.py simulator.py enrichment.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify HMAC audit chain and PHI pattern interception
        run: |
          python - <<'PY'
          from agents.base import AuditTrail, PHIGuard, SecurityException
          trail = AuditTrail()
          trail.log("ci", "test", "CHECK", {"task_id": "CI-001"})
          assert trail.verify_integrity()
          try:
              PHIGuard.assert_no_phi("MRN-123456")
          except SecurityException:
              pass
          else:
              raise AssertionError("PHI pattern was not blocked")
          print("Audit signature and PHI-pattern checks passed")
          PY
      - name: Verify package build
        run: python -m build --no-isolation
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.js = []
              def handle_starttag(self, tag, attrs):
                  self.active = tag == "script" and not dict(attrs).get("src")
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.js.append(data)

          parser = Scripts()
          parser.feed(Path("web/index.html").read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory() as d:
              path = Path(d) / "inline.js"
              path.write_text("\n".join(parser.js), encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          PY
