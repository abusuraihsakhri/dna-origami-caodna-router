services:
  dna-origami-caodna-router:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set a unique 32+-character AUDIT_SECRET_KEY in the environment}"
      AUDIT_LOG_READ_TOKEN: "${AUDIT_LOG_READ_TOKEN:-}"
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
