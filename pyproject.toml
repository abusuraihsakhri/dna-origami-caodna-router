[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-origami-caodna-router"
version = "2.0.0"
description = "Threshold-based DNA-origami-themed audit and telemetry demonstrator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]
all = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
dna-origami-caodna-router = "dna_origami_router.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dna-origami-caodna-router"
Repository = "https://github.com/abusuraihsakhri/dna-origami-caodna-router"

[tool.setuptools.packages.find]
include = ["agents*", "dna_origami_router*"]
